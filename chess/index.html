<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knight School | A little better, every move.</title>
  <meta name="description" content="Your local-first chess learning space. Learn openings and endgames, solve puzzles, play, and review.">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="./assets/knight-school.css?v=0371b8eefef117f6">
</head>
<body>
  <div id="knight-school">
    <section class="workspace">
      <h1>Knight School</h1>
      <p id="hosting-status" role="status">Loading your chess academy...</p>
      <noscript><p>JavaScript must be enabled to use the interactive chess academy.</p></noscript>
    </section>
  </div>
  <script>
    (() => {
      const status = document.getElementById("hosting-status");
      if (location.protocol === "file:") {
        status.textContent = "This is the website hosting package, not an offline HTML file. Close this file and run PREVIEW.cmd from the extracted ZIP to open a local web preview, or upload the chess folder to your website.";
        return;
      }
      const script = document.createElement("script");
      script.src = "./assets/knight-school.js?v=0371b8eefef117f6";
      script.onerror = () => {
        status.textContent = "The application JavaScript could not load. Upload the entire chess folder, including assets/knight-school.js and assets/knight-school.css, then refresh this page.";
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
